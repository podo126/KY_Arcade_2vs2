<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>KY 미니게임 배틀</title>
<style>/*@FONTS*/</style>
<style>/*@ROOT*/
/*@CSS*/</style>
</head>
<body>
<div id="stage">
  <div class="bgck"></div>
  <div id="netst"></div>
  <!-- 메인 -->
  <section class="scr" id="scr-main">
    <img id="logoImg" alt="KY Restaurant" style="position:absolute;left:50%;top:14px;width:264px;height:144px;margin-left:-132px;image-rendering:pixelated">
    <h1 class="title ol">KY 미니게임 배틀</h1>
    <div class="menu">
      <div class="field fr"><label>닉네임</label><input id="nameIn" maxlength="10" placeholder="최대 10자" autofocus></div>
      <div class="field fr"><label>Password</label><input id="passIn" type="password" maxlength="12" placeholder="비밀번호" autocomplete="off" autocapitalize="characters"></div>
      <div class="btn fr-item" data-act="enter">입장하기</div>
      <div class="btn fr-item" data-act="watch">관전하기 (큰 화면용)</div>
      <div class="btn fr-item" data-act="settings">설정</div>
    </div>
    <div class="hint"><span class="kk">↑</span><span class="kk">↓</span> 선택 · <span class="kk">Enter</span> 결정 · 패드·터치 가능</div>
  </section>
  <!-- 대기방 -->
  <section class="scr" id="scr-lobby">
    <div class="rm-head"><span class="ol">대기방</span></div>
    <div class="lb-info" id="lbInfo"></div>
    <div class="pslots"><div class="pslot fr" id="slot0"></div><div class="pslot fr" id="slot1"></div><div class="pslot fr" id="slot2"></div><div class="pslot fr" id="slot3"></div></div>
    <div class="lob-btns row">
      <div class="btn fr-item" id="bHow" data-act="how">게임 설명</div>
      <div class="btn fr-item" data-act="leave">나가기</div>
    </div>
    <div id="lbCd" class="ol" hidden></div>
    <div class="hint" id="lbHint"><span class="kk">←</span><span class="kk">→</span><span class="kk">↑</span><span class="kk">↓</span> 버튼 이동 · <span class="kk">Enter</span> READY</div>
    <div id="how" hidden><div class="how-in fr"><div class="how-top"><div class="how-l"><canvas id="howCv"></canvas></div><div class="how-r" id="howBody"></div></div>
      <div class="how-x small"><span class="keys"><span class="kk">←</span><span class="kk">→</span> 넘기기 · <span class="kk">Enter</span><span class="kk">Esc</span> 닫기</span><b class="hbtn" data-hf="-1">◀ 이전</b><b class="hbtn" data-hf="1">다음 ▶</b><b class="hbtn x" data-hx="1">닫기 ✕</b></div></div></div>
  </section>
  <!-- 게임: 게임 화면 + 개인 점수표 -->
  <section class="scr" id="scr-game">
    <div id="gHead"><b id="gTitle" class="ol"></b><span id="gSpec" hidden><b class="sd" data-sd="-1">◀</b><span id="gSpecN" class="ol2"></span><b class="sd" data-sd="1">▶</b></span><span id="gRoom"></span></div>
    <canvas id="gc"></canvas>
    <aside id="board" class="fr">
      <div id="bdTime">0:00</div>
      <div class="bd-cap">개인 순위 · 실시간</div>
      <div id="bdRows"></div>
    </aside>
    <div id="gHint"></div>
    <div id="pad"><div class="u" data-d="1">▲</div><div class="r" data-d="2">▶</div><div class="d" data-d="3">▼</div><div class="l" data-d="4">◀</div></div>
    <div id="abtn">A</div>
    <div id="intro" hidden><div class="intro-in fr"><div id="introBody"></div><div class="intro-f"><b id="introSec">6</b>초 뒤 시작합니다</div></div></div>
  </section>
  <!-- 결과 -->
  <section class="scr" id="scr-result">
    <div class="panel fr">
      <h2 class="ol" id="resTitle">결과</h2>
      <div class="small" id="resGame" style="margin:-6px 0 10px"></div>
      <div class="res" id="resBox"></div>
      <div id="resPs"></div>
      <div class="small" id="resNote" style="margin:10px 0 4px"></div>
      <div class="row" style="margin-top:10px"><div class="btn fr-item" data-act="home">메인으로</div></div>
    </div>
  </section>
  <!-- 설정 (오락실 파일과 같은 구성) -->
  <section class="scr" id="scr-settings">
    <div class="panel fr" style="width:760px">
      <h2 class="ol">설정</h2>
      <div class="btn fr-item" id="setSnd" data-act="snd"></div>
      <div class="btn fr-item" id="setFlt" data-act="flt"></div>
      <div class="btn fr-item" data-act="fs">전체 화면</div>
      <div class="btn fr-item" data-act="back">닫기</div>
    </div>
  </section>
  <div id="toast" class="fr-dark"></div>
</div>
<div id="rot" class="ol">📱 휴대폰을 가로로 돌려 주세요</div>
<script>/*@ASSETS*/</script>
<script>/*@VENDOR*/</script>
<script>/*@APP*/</script>
</body>
</html>
